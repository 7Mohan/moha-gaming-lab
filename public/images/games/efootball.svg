<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="efootball-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#0D1B3E"/>
      <stop offset="100%" stop-color="#040817"/>
    </linearGradient>
    <linearGradient id="efootball-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>
    <linearGradient id="efootball-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="128" height="128" rx="28" fill="url(#efootball-bg)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#FFE600" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Iconic eFootball Spiral Ring / Football -->
  <g transform="translate(24, 16)">
    <!-- Outer Dynamic Swirl (Cyan) -->
    <path d="M40 8 A32 32 0 1 0 72 40 A8 8 0 0 0 56 40 A16 16 0 1 1 40 24 A8 8 0 0 0 40 8 Z" fill="url(#efootball-cyan)"/>
    <!-- Inner Dynamic Swirl (Yellow) -->
    <path d="M40 72 A32 32 0 1 0 8 40 A8 8 0 0 0 24 40 A16 16 0 1 1 40 56 A8 8 0 0 0 40 72 Z" fill="url(#efootball-yellow)"/>
    <!-- Center Football Accent Core -->
    <circle cx="40" cy="40" r="10" fill="#FFFFFF"/>
    <polygon points="40,33 46,37 44,44 36,44 34,37" fill="#0D1B3E"/>
  </g>

  <!-- eFootball Wordmark Banner -->
  <g transform="translate(16, 94)">
    <rect x="0" y="0" width="96" height="22" rx="6" fill="#FFE600"/>
    <text x="48" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Impact, Roboto, sans-serif" font-weight="900" font-size="12" fill="#0D1B3E" text-anchor="middle" letter-spacing="1">eFOOTBALL™</text>
  </g>
</svg>
