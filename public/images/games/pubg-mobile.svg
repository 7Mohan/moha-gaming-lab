<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="pubg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1B18"/>
      <stop offset="50%" stop-color="#12100E"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>
    <linearGradient id="pubg-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="50%" stop-color="#E08B10"/>
      <stop offset="100%" stop-color="#BF6F00"/>
    </linearGradient>
    <filter id="pubg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F5A623" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="128" height="128" rx="28" fill="url(#pubg-bg)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#F5A623" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Level 3 Helmet Silhouette -->
  <g filter="url(#pubg-glow)" transform="translate(18, 16)">
    <!-- Helmet Dome -->
    <path d="M46 6 C28 6 14 18 10 34 C8 42 8 50 10 58 L12 66 L22 68 L24 74 L68 74 L70 68 L80 66 L82 58 C84 50 84 42 82 34 C78 18 64 6 46 6 Z" fill="#2E2824" stroke="#4A403A" stroke-width="2"/>
    <!-- Visor Shield Frame -->
    <path d="M16 38 L76 38 L78 54 L14 54 Z" fill="#1A1715" stroke="url(#pubg-gold)" stroke-width="2.5"/>
    <!-- Visor Slit -->
    <rect x="22" y="44" width="48" height="4" rx="2" fill="#F5A623"/>
    <!-- Top Rivets & Weld Line -->
    <circle cx="46" cy="18" r="2" fill="#887B72"/>
    <path d="M46 8 L46 28" stroke="#887B72" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>
  
  <!-- PUBG Text Banner -->
  <g transform="translate(16, 94)">
    <rect x="0" y="0" width="96" height="22" rx="6" fill="#F5A623"/>
    <text x="48" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Impact, Roboto, sans-serif" font-weight="900" font-size="13" fill="#0D0B0A" text-anchor="middle" letter-spacing="1.5">PUBG MOBILE</text>
  </g>
</svg>
